<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Der Klimabeichtstuhl</title>
<style>
:root{--bg:#f6f0e6;--card:#fffaf2;--accent:#6f8f54;--dark:#3f5f35;--gold:#c6a15b;--text:#2e2a24;--muted:#6f675c;--warn:#8a5b2d}
*{box-sizing:border-box} body{margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px;background:linear-gradient(135deg,#f7efd9,#e8f0df)}
.app{width:100%;max-width:880px;background:rgba(255,250,242,.97);border:1px solid #d8c69c;border-radius:30px;box-shadow:0 18px 50px #54462c2e;overflow:hidden}
.header{background:linear-gradient(135deg,#faf3df,#dfead5);padding:32px 28px 24px;text-align:center;border-bottom:1px solid #d8c69c}
.icon{width:62px;height:62px;margin:0 auto 12px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:32px;background:#fffaf0}
h1{margin:0;font-size:44px;letter-spacing:.04em;font-weight:500}.subtitle{margin:10px auto 0;max-width:680px;color:var(--muted);font-size:17px;line-height:1.4}
.content{padding:34px}.progress{height:9px;background:#e5dccb;border-radius:99px;overflow:hidden;margin-bottom:26px}.bar{height:100%;background:linear-gradient(90deg,var(--accent),#b7c879);transition:.3s}
.question-number{text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:13px;margin-bottom:12px}.question{text-align:center;font-size:29px;line-height:1.25;margin:0 0 26px;font-weight:500}
.options{display:grid;gap:12px}button{font-family:inherit;border:none;cursor:pointer}.option{width:100%;text-align:left;padding:16px 18px;font-size:18px;line-height:1.3;background:#fffdf8;border:1px solid #ddd1bb;border-radius:16px;color:var(--text)}.option:hover,.option:focus{background:#edf4e7;border-color:var(--accent);outline:none}
.primary,.secondary{display:block;margin:24px auto 0;padding:15px 30px;min-width:220px;border-radius:999px;font-size:18px}.primary{background:var(--accent);color:#fff}.primary:hover{background:var(--dark)}.secondary{background:#fff7e4;color:#6a5522;border:1px solid #e2c987}
.start p,.result p,.confession p{font-size:19px;text-align:center;line-height:1.5}.badges{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.badge{background:#fff7e4;border:1px solid #e2c987;border-radius:999px;padding:8px 12px;color:#6a5522;font-size:14px}
.co2box,.absolution{margin:22px auto;padding:22px;max-width:620px;border-radius:22px;text-align:center}.co2box{background:#fff7e4;border:1px solid #e2c987}.absolution{background:#eef5e8;border:1px solid #bfd0ac}.absolution strong{display:block;font-size:28px;margin-bottom:8px;color:var(--dark)}.co2value{display:block;font-size:36px;color:var(--warn);margin:8px 0}
input{display:block;width:100%;max-width:540px;margin:18px auto 0;padding:15px 16px;border-radius:14px;border:1px solid #d6c7ac;font-size:18px;font-family:Arial,sans-serif;background:#fffdf8}.smallrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.smallrow button{margin-left:0;margin-right:0}
.note{margin-top:24px;font-size:14px;color:var(--muted);text-align:center;line-height:1.45}.footer{background:#f3ead8;padding:16px 22px;text-align:center;color:var(--muted);font-size:13px;line-height:1.4}
@media(max-width:600px){h1{font-size:32px}.question{font-size:23px}.content{padding:24px}.option{font-size:17px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="icon">🌿</div><h1>Der Klimabeichtstuhl</h1><div class="subtitle">Religiöse Metaphern in der Debatte um globale Erwärmung, Mobilität und Nachhaltigkeit</div></header>
<main class="content" id="app"></main>
<footer class="footer">Ein wissenschaftlich-künstlerisches Projekt — keine religiöse Beichte. Der CO₂e-Wert ist eine symbolische Näherung und keine exakte persönliche CO₂-Bilanz.</footer>
</div>
<script>
const questions=[
["Gewissenserforschung I","Wie oft denkst du über deinen ökologischen Fußabdruck nach?",[["Mehrmals täglich",0],["Mehrmals pro Woche",80],["Gelegentlich",180],["Möglichst selten",300]]],
["Gewissenserforschung II","Welche deiner ökologischen Verfehlungen beschäftigt dich am meisten?",[["Mobilität",700],["Konsum",400],["Ernährung",450],["Energieverbrauch",500],["Keine davon",0]]],
["Versuchung I","Wenn du gegen deine Umweltüberzeugungen handelst, was ist meist der Grund?",[["Bequemlichkeit",300],["Zeitmangel",220],["Gewohnheit",250],["Kosten",120],["Ich handle nie gegen meine Überzeugungen.",0]]],
["Versuchung II","Welcher Versuchung erliegst du am häufigsten?",[["Billigflug",1200],["Online-Shopping",350],["Autofahrt",700],["Fleischgericht",450],["Streaming-Marathon",120]]],
["Klimasünden I","Wie oft kaufst du Dinge, die du eigentlich nicht brauchst?",[["Sehr häufig",700],["Gelegentlich",400],["Selten",150],["Fast nie",40]]],
["Klimasünden II","Welche ökologische Sünde erscheint dir gesellschaftlich am meisten akzeptiert?",[["Fliegen",0],["Autofahren",0],["Konsum",0],["Lebensmittelverschwendung",0],["Energieverschwendung",0]]],
["Schuld und Verantwortung I","Wer trägt die größte Verantwortung für die ökologische Krise?",[["Ich selbst",0],["Die Politik",0],["Die Wirtschaft",0],["Alle gemeinsam",0]]],
["Schuld und Verantwortung II","Glaubst du, individuelles Handeln macht einen Unterschied, um aus der Krise zu kommen?",[["Ja",0],["Eher ja",0],["Eher nein",0],["Nein",0]]],
["Umkehr und Buße I","Welche Form des Verzichts wäre für dich am leichtesten?",[["Weniger Autofahren",0],["Weniger Fleisch",0],["Weniger Konsum",0],["Weniger Flugreisen",0]]],
["Umkehr und Buße II","Welche Form des Verzichts wäre für dich am schwersten?",[["Autofahren reduzieren",250],["Fleisch reduzieren",180],["Weniger kaufen",150],["Weniger reisen",300]]],
["Hoffnung und Erlösung","Woran glaubst du angesichts der ökologischen Krise?",[["Der technologische Fortschritt wird es richten!",0],["Nur in der Gemeinschaft werden wir die Krise überwinden!",0],["Wenn jeder und jede sich persönlich einschränkt, werden wir es schaffen!",0],["Ich bin unsicher",0]]]
];
let current=-1,co2=0,confession="";
function absolution(c){if(c<=1800)return["Eine halbe Stunde Fahrradfahren","Für dich. Für andere. Für die Schöpfung."];if(c<=3200)return["5 Mal Treppensteigen","Statt Aufzug oder Rolltreppe."];if(c<=4800)return["Ein fleischfreier Tag","Eine kleine Übung in ökologischer Umkehr."];if(c<=6500)return["Eine Woche ohne unnötige Neuanschaffungen","Eine Bußübung gegen die Versuchung des Sofortkaufs."];return["Ein autofreier Sonntag","Gehe hin in Frieden — aber möglichst zu Fuß, per Rad oder mit der Bahn."]}
function start(){current=0;co2=0;confession="";renderQuestion()}
function renderStart(){app.innerHTML='<div class="start"><p>Lege dein ökologisches Gewissen offen und empfange am Ende eine kleine Bußauflage.</p><button class="primary" onclick="start()">Beichte beginnen</button><div class="badges"><span class="badge">3–5 Minuten</span><span class="badge">11 Fragen</span><span class="badge">symbolischer CO₂e-Wert</span></div></div>'}
function renderQuestion(){let q=questions[current],p=current/questions.length*100,s='<div class="progress"><div class="bar" style="width:'+p+'%"></div></div><div class="question-number">'+q[0]+' · Frage '+(current+1)+' von '+questions.length+'</div><h2 class="question">'+q[1]+'</h2><div class="options">';q[2].forEach(o=>s+='<button class="option" onclick="answer('+o[1]+')">'+o[0]+'</button>');app.innerHTML=s+'</div>'}
function answer(v){co2+=v;current++;current>=questions.length?renderConfession():renderQuestion()}
function renderConfession(){app.innerHTML='<div class="confession"><div class="progress"><div class="bar" style="width:96%"></div></div><div class="question-number">Optionales Bekenntnis</div><h2 class="question">Welche ökologische Sünde möchtest du heute bekennen?</h2><p>Ein kurzer Satz genügt. Du kannst dieses Feld auch überspringen.</p><input id="confessionInput" maxlength="90" autocomplete="off" placeholder="z. B. Ich nehme zu oft das Auto."><div class="smallrow"><button class="primary" onclick="finish()">Absolution empfangen</button><button class="secondary" onclick="finish(true)">Überspringen</button></div><div class="note">Maximal 90 Zeichen. Die Eingabe wird in dieser Version nicht gespeichert.</div></div>'}
function finish(skip){confession=skip?"":(document.getElementById("confessionInput")?.value.trim()||"");renderResult()}
function renderResult(){let a=absolution(co2),tons=(co2/1000).toFixed(1).replace(".",","),line=confession?'<p><em>Dein Bekenntnis wurde gehört: „'+escapeHtml(confession)+'“</em></p>':"";app.innerHTML='<div class="result"><div class="progress"><div class="bar" style="width:100%"></div></div><h2 class="question">Deine Absolution</h2>'+line+'<div class="co2box"><span>Symbolischer Beichtwert</span><strong class="co2value">ca. '+tons+' t CO₂e/Jahr</strong><span>Dieser Wert ist keine exakte persönliche Bilanz, sondern eine spielerische Annäherung.</span></div><div class="absolution"><strong>'+a[0]+'</strong><span>'+a[1]+'</span></div><p><strong>Deine Beichte wurde gehört.</strong><br>Nicht Perfektion ist gefragt, sondern Richtung.</p><button class="primary" onclick="renderStart()">Neue Beichte</button><div class="note">Die religiöse Sprache ist Teil des Experiments.</div></div>'}
function escapeHtml(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
renderStart();
</script>
</body>
</html>
